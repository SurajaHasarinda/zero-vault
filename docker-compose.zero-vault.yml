version: '3.8'

services:
  app:
    image: surajadev/zero-vault:latest
    container_name: zero-vault
    ports:
      - "8766:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-to-a-random-secret-key}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - TZ=Asia/Colombo
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
