<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vault Zero — Zero-Knowledge Secret Manager</title>
    <meta name="description" content="A zero-knowledge secret manager. Your secrets never leave your browser unencrypted." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              vault: '#8B5CF6',
              'vault-dark': '#7C3AED',
              'vault-light': '#A78BFA',
              success: '#10B981',
              warning: '#F59E0B',
              danger: '#EF4444',
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

      body {
        font-family: 'Inter', system-ui, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
      }

      .font-mono {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }

      @keyframes slide-up {
        from { transform: translateY(100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @keyframes shrink {
        from { width: 100%; }
        to { width: 0%; }
      }
      @keyframes fade-in {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.15); }
        50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.3); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }

      .animate-slide-up { animation: slide-up 0.3s ease-out; }
      .animate-fade-in { animation: fade-in 0.25s ease-out; }
      .animate-pulse-glow { animation: pulse-glow 3s ease-in-out infinite; }
      .animate-float { animation: float 3s ease-in-out infinite; }

      .glass {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
